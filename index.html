<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elegan One • Giriş Yap</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:#8b90a0;--fld:#0d0f14;--bd:#232734;--btn:#f3f4f8;--btnt:#000;--err:#ff6b6b;--ok:#5bd68a;--glow:rgba(110,130,255,.16);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:dark}
:root[data-theme=light]{--bg:#fff;--fg:#0b0d12;--mut:#5d6373;--fld:#f4f5f8;--bd:#d9dce5;--btn:#0b0d12;--btnt:#fff;--err:#d93636;--ok:#1f9d55;--glow:rgba(90,110,255,.13);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100dvh;position:relative;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Inter","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background-color .4s,color .4s}
.glow{position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 28% 30%,var(--glow),transparent 70%),radial-gradient(35% 30% at 76% 72%,var(--glow),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
header,main,footer{position:relative;z-index:1}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes turn{from{opacity:0;transform:rotate(-90deg) scale(.6)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:center;padding:clamp(8px,2vh,20px) 28px}
.lg{position:relative;overflow:hidden;display:block}
.lg img{display:block;max-width:none}
.lg.a{width:clamp(110px,20vw,210px);aspect-ratio:8/1;animation:slideL .9s var(--ease) .1s both}
.lg.b{height:clamp(38px,6.5vh,56px);width:44px;animation:slideR .9s var(--ease) .1s both}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 20px;overflow-y:auto}
form{width:100%;max-width:560px;margin:auto}
h1{text-align:center;font-size:clamp(28px,5vh,40px);margin:0 0 clamp(12px,3.5vh,32px);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.f{min-width:0;padding-bottom:clamp(8px,1.8vh,16px)}
.f label{display:block;color:var(--mut);font-size:15px;margin:0 0 clamp(4px,.9vh,8px);transition:color .3s}
.f:focus-within label{color:var(--fg)}
.in #fE,.in #fP{grid-column:1/-1}
.f.su{max-height:0;opacity:0;padding-bottom:0;overflow:hidden;transform:translateY(-8px);visibility:hidden;pointer-events:none;transition:max-height .5s var(--ease),opacity .3s,transform .5s var(--ease),padding .5s var(--ease),visibility 0s .5s}
.up .f.su{max-height:170px;opacity:1;padding-bottom:clamp(8px,1.8vh,16px);transform:none;visibility:visible;pointer-events:auto;transition:max-height .5s var(--ease),opacity .45s .1s,transform .5s var(--ease) .05s,padding .5s var(--ease),visibility 0s}
.rise{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + 250ms)}
input{width:100%;height:clamp(44px,7vh,56px);border-radius:16px;border:1px solid var(--bd);background:var(--fld);color:var(--fg);padding:0 18px;font:inherit;transition:border-color .25s,box-shadow .25s,background-color .4s,color .4s}
input:focus{outline:0;border-color:var(--mut);box-shadow:inset 0 0 0 1px var(--mut)}
.f.bad input{border-color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
input.shake{animation:shake .4s}
.e{font-size:13px;line-height:1.3;color:var(--err);max-height:0;opacity:0;overflow:hidden;transform:translateY(-4px);transition:max-height .3s,opacity .3s,transform .3s,margin .3s}
.f.bad .e{max-height:60px;opacity:1;transform:none;margin-top:6px}
.pw{position:relative}
.pw input{padding-inline-end:52px}
.eye{position:absolute;inset-block:0;inset-inline-end:4px;width:46px;background:none;border:0;color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:color .2s,transform .2s}
.eye:hover{color:var(--fg)}
.eye:active{transform:scale(.9)}
#msg{min-height:20px;text-align:center;font-size:14px;color:var(--err);margin:0 0 10px;transition:color .3s}
#msg.ok{color:var(--ok)}
#msg.n{color:var(--mut)}
#msg:not(:empty){animation:swap .3s var(--ease)}
.go{position:relative;width:100%;height:clamp(46px,7vh,58px);border:0;border-radius:16px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:700;cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s,background-color .4s,color .4s}
.go:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px var(--fg)}
.go:active{transform:scale(.98);box-shadow:none}
.go.load{color:transparent;pointer-events:none}
.go.load::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:2px solid var(--btnt);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.flip h1,.flip .go{animation:swap .5s var(--ease) .05s both}
.boot .flip .go{animation-delay:.55s}
.row{display:flex;justify-content:space-between;margin:clamp(10px,2vh,18px) 4px clamp(12px,3vh,26px)}
.row button{color:var(--mut);background:none;border:0;font:inherit;padding:0;cursor:pointer;transition:color .2s,opacity .3s}
.row button:hover{color:var(--fg)}
.up #fg{opacity:0;pointer-events:none}
.prov{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.prov button{aspect-ratio:1;border-radius:14px;border:1px solid var(--bd);background:var(--fld);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;animation:pop .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i)*60ms + 800ms);transition:transform .25s var(--ease),border-color .25s,background-color .4s,color .4s}
.prov button.off{opacity:.45}
.prov button:hover{transform:translateY(-3px);border-color:var(--mut)}
.prov button:active{transform:scale(.94)}
.prov svg{width:52%;height:52%;fill:currentColor}
button:focus-visible,select:focus-visible{outline:2px solid var(--mut);outline-offset:2px}
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:clamp(6px,1.5vh,16px) 24px;animation:fadeIn 1s ease 1.2s both}
.studio{color:var(--mut);font-size:14px;letter-spacing:.03em;white-space:nowrap}
select{height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--fld);color:var(--fg);font:inherit;padding:0 12px;margin-inline-start:10px;transition:border-color .25s,background-color .4s,color .4s}
select:hover{border-color:var(--mut)}
#th{justify-self:end;width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--fld);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:transform .25s var(--ease),border-color .25s,background-color .4s,color .4s}
#th:hover{border-color:var(--mut);transform:scale(1.06)}
#th svg{width:22px;height:22px;fill:currentColor;animation:turn .5s var(--ease)}
@media(max-width:480px){.grid{column-gap:10px}.f label{font-size:14px}input{padding:0 14px}.prov{gap:5px}.lg.b{height:40px}#lLang{display:none}.studio{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header>
  <span class="lg a"><img data-n="elegan_1.png" src="logo/elegan_1.png" alt="Elegan" onerror="this.style.visibility='hidden'"></span>
  <span class="lg b"><img data-n="one_1.png" src="logo/one_1.png" alt="One" onerror="this.style.visibility='hidden'"></span>
</header>
<main>

    <div class="grid">

      <div class="f rise" id="fP" style="--i:1"><label for="pw" id="lPw"></label><div class="pw"><input id="pw" type="password" autocomplete="current-password" maxlength="64"><button type="button" class="eye" data-t="pw" aria-label="Show / hide password"></button></div><div class="e" role="alert"></div></div>
      <div class="f su" id="fP2"><label for="pw2" id="lPw2"></label><div class="pw"><input id="pw2" type="password" autocomplete="new-password" maxlength="64"><button type="button" class="eye" data-t="pw2" aria-label="Show / hide password"></button></div><div class="e" role="alert"></div></div>
    </div>
    <div id="msg" role="status"></div>
    <button class="go" id="go" type="submit"></button>
    <div class="row rise" style="--i:4"><button type="button" id="fg"></button><button type="button" id="sw"></button></div>
    <div class="prov" id="prov"></div>
  </form>
</main>
<footer>
  <div><span id="lLang">Dil</span><select id="lang" aria-label="Language"></select></div>
  <div class="studio">© Elegan Studios</div>
  <button id="th" type="button" aria-label="Theme"></button>
</footer>

const NAMES={google:"Google",facebook:"Facebook",apple:"Apple",microsoft:"Microsoft",xbox:"Xbox",github:"GitHub",playstation:"PlayStation",epic:"Epic Games"};
const PROV={
google:()=>new GoogleAuthProvider(),facebook:()=>new FacebookAuthProvider(),
apple:()=>new OAuthProvider("apple.com"),microsoft:()=>new OAuthProvider("microsoft.com"),
xbox:()=>new OAuthProvider("microsoft.com"),github:()=>new GithubAuthProvider(),
playstation:()=>new OAuthProvider("oidc.playstation"),epic:()=>new OAuthProvider("oidc.epic")};

const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ENABLED=["google"]; // diğerlerini açmak için buraya ekle: "facebook","apple","microsoft","xbox","github","playstation","epic"
const EM=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const IDS=["fN","fS","fA","fE","fP","fP2"];
const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.7A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
let lang,mode="in",busy=false;

// Dil: kayıtlı > sistem > tr
function pickLang(){
  const s=store.get("lang");if(s&&T[s])return s;
  try{for(const l of navigator.languages||[navigator.language]){const c=(l||"").slice(0,2).toLowerCase();if(T[c])return c}}catch(e){}
  return "tr";
}
// Tema: kayıtlı > sistem > koyu
function pickTheme(){
  const s=store.get("theme");if(s)return s;
  try{if(matchMedia("(prefers-color-scheme: light)").matches)return "light";if(matchMedia("(prefers-color-scheme: dark)").matches)return "dark"}catch(e){}
  return "dark";
}
function setTheme(t){
  document.documentElement.dataset.theme=t;
  $("th").innerHTML=t==="dark"
   ?'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>'
   :'<svg viewBox="0 0 24 24"><path d="M21 14.5A9 9 0 0 1 9.5 3 9 9 0 1 0 21 14.5z"/></svg>';
}
const v=k=>$(k).value.trim();
function msg(s,k){const m=$("msg");m.textContent=s||"";m.className=k||""}
function setErr(id,txt){
  const f=$(id);f.classList.toggle("bad",!!txt);f.querySelector(".e").textContent=txt||"";
  if(txt){const i=f.querySelector("input");i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake")}
}
function clearErrs(){IDS.forEach(i=>setErr(i,""))}
function flip(){const f=$("f");f.classList.remove("flip");void f.offsetWidth;f.classList.add("flip")}
function render(){
  const t=T[lang],up=mode==="up";
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("ttl").textContent=up?t[2]:t[1];
  [["lNm",15],["lSn",16],["lAg",17],["lEm",3],["lPw",4],["lPw2",18]].forEach(([i,k])=>$(i).textContent=t[k]);
  $("go").textContent=up?t[6]:t[5];$("fg").textContent=t[7];
  $("sw").textContent=up?t[9]:t[8];$("lLang").textContent=t[13];
  $("pw").autocomplete=up?"new-password":"current-password";
  document.title="Elegan One • "+t[up?2:1];
}
function validate(){
  const t=T[lang],up=mode==="up";let ok=true;
  const bad=(id,m)=>{setErr(id,m);ok=false};
  clearErrs();
  if(up){
    if(!v("nm"))bad("fN",t[19]);
    if(!v("sn"))bad("fS",t[19]);
    const a=v("ag");
    if(!a)bad("fA",t[19]);else if(!/^\d{1,3}$/.test(a)||+a<13||+a>120)bad("fA",t[23]);
  }
  if(!v("em"))bad("fE",t[19]);else if(!EM.test(v("em")))bad("fE",t[20]);
  const pw=$("pw").value;
  if(!pw)bad("fP",t[19]);
  else if(up&&!(pw.length>=8&&/[a-z]/.test(pw)&&/[A-Z]/.test(pw)&&/\d/.test(pw)))bad("fP",t[21]);
  if(up){const p2=$("pw2").value;if(!p2)bad("fP2",t[19]);else if(pw&&p2!==pw)bad("fP2",t[22])}
  return ok;
}
function fail(e){
  const t=T[lang],c=e&&e.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return setErr("fP",t[24]);
  if(c==="auth/email-already-in-use")return setErr("fE",t[25]);
  if(c==="auth/invalid-email")return setErr("fE",t[20]);
  if(c==="auth/weak-password")return setErr("fP",t[21]);
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return;
  msg(t[12]+(c?" ("+c+")":""));
}

lang=pickLang();
$("lang").innerHTML=Object.keys(T).map(k=>`<option value="${k}">${T[k][0]}</option>`).join("");
$("lang").value=lang;
$("lang").onchange=e=>{lang=e.target.value;store.set("lang",lang);clearErrs();msg();render();flip()};
setTheme(pickTheme());
$("th").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";store.set("theme",t);setTheme(t)};
$("prov").innerHTML=Object.keys(ICON).map((k,n)=>`<button type="button" class="${ENABLED.includes(k)?"":"off"}" style="--i:${n}" data-p="${k}" title="${NAMES[k]}" aria-label="${NAMES[k]}"><svg viewBox="0 0 24 24">${ICON[k][0]==="<"?ICON[k]:`<path d="${ICON[k]}"/>`}</svg></button>`).join("");
document.querySelectorAll(".eye").forEach(b=>{
  b.innerHTML=EYE;
  b.onclick=()=>{const i=$(b.dataset.t),s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?EYEOFF:EYE;b.setAttribute("aria-pressed",s)};
});
$("ag").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,3)});
$("f").addEventListener("input",e=>{
  const f=e.target.closest&&e.target.closest(".f");
  if(f&&f.classList.contains("bad")){f.classList.remove("bad");f.querySelector(".e").textContent=""}
  msg();
});
render();
document.body.classList.add("boot");setTimeout(()=>document.body.classList.remove("boot"),1500);

$("sw").onclick=()=>{
  mode=mode==="in"?"up":"in";
  const f=$("f");f.classList.toggle("up",mode==="up");f.classList.toggle("in",mode==="in");
  clearErrs();msg();render();flip();
};
$("f").onsubmit=async e=>{
  e.preventDefault();if(busy)return;msg();
  if(!validate())return;
  busy=true;$("go").classList.add("load");
  try{
    if(mode==="up"){
      const c=await createUserWithEmailAndPassword(auth,v("em"),$("pw").value);
      try{await updateProfile(c.user,{displayName:v("nm")+" "+v("sn")})}catch(_){}
    }else await signInWithEmailAndPassword(auth,v("em"),$("pw").value);
    location.href=AFTER;
  }catch(err){fail(err)}
  busy=false;$("go").classList.remove("load");
};
$("fg").onclick=async()=>{
  const t=T[lang];msg();setErr("fE","");
  const em=v("em");
  if(!em)return setErr("fE",t[19]);
  if(!EM.test(em))return setErr("fE",t[20]);
  try{await sendPasswordResetEmail(auth,em);msg(t[11],"ok")}catch(err){fail(err)}
};
onAuthStateChanged(auth,u=>{if(u&&store.get("rd")){store.set("rd","");location.href=AFTER}});
$("prov").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;msg();
  if(!ENABLED.includes(b.dataset.p)){msg(T[lang][14],"n");return}
  const p=PROV[b.dataset.p]();
  try{await signInWithPopup(auth,p);location.href=AFTER}
  catch(err){
    if(err.code==="auth/popup-blocked"){store.set("rd","1");try{await signInWithRedirect(auth,p);return}catch(e2){err=e2}}
    fail(err);
  }
};

// Logolar: orijinal (boşluklu) dosyaysa kırp, zaten kırpılmışsa olduğu gibi göster
const CROP={"elegan_1.png":[2000,1333,151,568,1632,198],"one_1.png":[1200,1200,365,285,550,630]};
document.querySelectorAll(".lg img").forEach(im=>{const go=()=>{const c=CROP[im.dataset.n],p=im.parentNode;if(c&&im.naturalWidth===c[0]&&im.naturalHeight===c[1]){p.style.aspectRatio=c[4]+"/"+c[5];Object.assign(im.style,{position:"absolute",width:(c[0]/c[4]*100)+"%",height:"auto",left:(-c[2]/c[4]*100)+"%",top:(-c[3]/c[5]*100)+"%"})}else if(im.naturalWidth){p.style.aspectRatio=im.naturalWidth+"/"+im.naturalHeight;Object.assign(im.style,{width:"100%",height:"100%",objectFit:"contain"})}if(p.classList.contains("b"))p.style.width="auto"};im.complete&&im.naturalWidth?go():im.addEventListener("load",go)});
</script>
