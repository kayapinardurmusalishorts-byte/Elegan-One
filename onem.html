const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const EM=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pickLang(){
  const s=store.get("lang");if(s&&T[s])return s;
  try{for(const l of navigator.languages||[navigator.language]){const c=(l||"").slice(0,2).toLowerCase();if(T[c])return c}}catch(e){}
  return "tr";
}
function pickTheme(){
  const s=store.get("theme");if(s)return s;
  try{if(matchMedia("(prefers-color-scheme: light)").matches)return "light"}catch(e){}
  return "dark";
}

const day0=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
const hhmm=ms=>new Date(ms).toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"});
const isToday=ms=>day0(ms)===day0(Date.now());
const isYest=ms=>day0(ms)===day0(Date.now())-864e5;
const dateLong=ms=>new Date(ms).toLocaleDateString(lang,{day:"numeric",month:"long",year:"numeric"});
const dateShort=ms=>new Date(ms).toLocaleDateString(lang,{day:"2-digit",month:"2-digit",year:"2-digit"});
const dayLabel=ms=>isToday(ms)?t("today"):isYest(ms)?t("yest"):dateLong(ms);
const listTime=ms=>isToday(ms)?hhmm(ms):isYest(ms)?t("yest"):dateShort(ms);
const ms=ts=>ts&&ts.toMillis?ts.toMillis():0;
function avColor(s){let h=0;for(const c of String(s||"?"))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 42% 40%)`}
const initial=n=>esc(((String(n||"?").trim()[0])||"?").toUpperCase());

const seenRow=new Set(),rowAt=new Map();let seenMsg=new Set(),msgAt=new Map(),msgPainted=false;
const animOf=(M,k,dur)=>{const st=M.get(k);if(st===undefined)return["",""];const dl=st-Date.now();if(dl<-dur){M.delete(k);return["",""]}return[" a",` style="--d:${Math.round(dl)}ms"`]};

let AC=null,lastSnd=0;
const unlock=()=>{try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}};
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function tone(f,t0,d,v){const T=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(f,T);g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+.015);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d+.05)}
function sound(k){try{if(!AC||AC.state!=="running")return;const n=Date.now();if(n-lastSnd<120)return;lastSnd=n;if(k==="in"){tone(880,0,.2,.12);tone(1318.5,.09,.3,.1)}else{tone(520,0,.09,.05);tone(780,.05,.12,.04)}}catch(e){}}

// ---- sohbet listesi
function pubUnread(){return Math.min(99,pubRows.filter(r=>r.from!==me.uid&&!r.pending&&!r.deleted&&ms(r.at)>pubReadAt).length)}
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  let h="";
  const pl=pubRows.length?pubRows[pubRows.length-1]:null,pu=pubUnread();
  let ai=0;
  const bA=(k,n)=>{const p=badgeVal.get(k);if(p!==undefined&&p!==n)badgeAt.set(k,Date.now());badgeVal.set(k,n);return Date.now()-(badgeAt.get(k)||0)<500?" bump":""};
  const rA=k=>{if(!seenRow.has(k)){seenRow.add(k);rowAt.set(k,Date.now()+120+Math.min(ai++,12)*55)}return animOf(rowAt,k,750)};
  if(!q||"one chat".includes(q)||(pl&&(pl.text||"").toLowerCase().includes(q))){
    const pv=pl?(pl.deleted?t("deleted"):(pl.from===me.uid?t("you"):(pl.name||""))+": "+pl.text):t("pub");
    const[c0,s0]=rA("pub");
    h+=`<button class="row${cur&&cur.pub?" on":""}${pu?" unr":""}${c0}"${s0} data-k="pub"><div class="av pubav">${PEOPLE}</div><div class="rc"><div class="r1"><b>One Chat</b><time>${pl&&pl.at?listTime(ms(pl.at)):""}</time></div><div class="r2"><span>${esc(pv)}</span>${pu?`<i class="bd${bA("pub",pu)}">${pu}</i>`:""}</div></div></button>`;
  }
  const items=chats.filter(c=>!q||(c.peer&&((c.peer.name||"").toLowerCase().includes(q)||(c.peer.email||"").toLowerCase().includes(q)))||(c.last&&(c.last.text||"").toLowerCase().includes(q)));
  items.forEach(c=>{
    const p=c.peer||{},l=c.last,u=c.unread||0;
    const[c1,s1]=rA(c.id);
    h+=`<button class="row${cur&&cur.id===c.id?" on":""}${u>0?" unr":""}${c1}"${s1} data-id="${esc(c.id)}"><div class="av" style="background:${avColor(p.email||p.name)}">${initial(p.name||p.email)}</div><div class="rc"><div class="r1"><b>${esc(p.name||p.email)}</b><time>${l&&l.at?listTime(ms(l.at)):""}</time></div><div class="r2"><span>${esc(l?l.text:"")}</span>${u>0?`<i class="bd${bA(c.id,Math.min(u,99))}">${Math.min(u,99)}</i>`:""}</div></div></button>`;
  });
  if(EM.test(q)&&!chats.some(c=>c.peer&&(c.peer.email||"").toLowerCase()===q)){
    const[c2,s2]=rA("start:"+q);
    h+=`<button class="row${c2}"${s2} data-start="${esc(q)}"><div class="av pubav"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="rc"><div class="r1"><b>${esc(t("start"))}</b></div><div class="r2"><span>${esc(q)}</span></div></div></button>`;
  }else if(!items.length&&!q){h+=`<div class="empty">${esc(t("empty"))}</div>`}
  $("list").innerHTML=h;
  const n=chats.reduce((a,c)=>a+(c.unread||0),0)+pu;
  document.title=(n?`(${n}) `:"")+"One M";
}

// ---- iletişim: kişi başlatma
async function startChat(email){
  email=email.trim().toLowerCase();
  if(!EM.test(email))return toast(t("badEm"));
  if(email===(me.email||"").toLowerCase())return toast(t("self"));
  const ex=chats.find(c=>c.peer&&(c.peer.email||"").toLowerCase()===email);
  if(ex){$("q").value="";renderList();return openChat(ex)}
  try{
    const s=await getDoc(doc(db,"emails",email));
    if(!s.exists())return toast(t("nf"));
    const o=s.data(),id=[me.uid,o.uid].sort().join("_"),peer={uid:o.uid,name:o.name||email,email};
    await setDoc(doc(db,"users",me.uid,"chats",id),{peer,updated:serverTimestamp(),unread:0},{merge:true});
    $("q").value="";renderList();openChat({id,peer});
  }catch(e){toast(t("err"))}
}

function showConv(){$("ph").hidden=true;$("conv").hidden=false;$("app").classList.add("open");if(!(history.state&&history.state.chat))history.pushState({chat:1},"")}
function setHead(){
  const a=$("hav");
  if(cur.pub){a.className="av pubav";a.style.background="";a.innerHTML=PEOPLE;$("hnm").textContent="One Chat"}
  else{a.className="av";a.style.background=avColor(cur.peer.email||cur.peer.name);a.textContent=(cur.peer.name||cur.peer.email||"?").trim()[0].toUpperCase();$("hnm").textContent=cur.peer.name||cur.peer.email}
}
function resetConv(){
  stop("msgs");stop("meta");stop("peer");
  rows=[];meta={};peerDoc=null;replyTo=null;stick=true;newCnt=0;prevLen=0;seenMsg=new Set();msgAt=new Map();msgPainted=false;stState.clear();stAt.clear();typShown=false;openedAt=Date.now();
  $("rbar").hidden=true;$("ta").value="";autosize();
}
function openChat(c){
  resetConv();
  cur={id:c.id,peer:c.peer,pub:false};
  setHead();updateStatus();showConv();renderMsgs();renderList();
  const id=c.id,pid=c.peer.uid;
  U.msgs=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("at","desc"),limit(150)),s=>{
    rows=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"}),pending:d.metadata.hasPendingWrites})).reverse();
    renderMsgs();markRead();
  },()=>toast(t("err")));
  U.meta=onSnapshot(doc(db,"chats",id,"meta","state"),s=>{meta=s.exists()?s.data():{};renderMsgs();updateStatus()},()=>{});
  U.peer=onSnapshot(doc(db,"users",pid),s=>{peerDoc=s.exists()?s.data():null;updateStatus()},()=>{});
  if(fine())$("ta").focus({preventScroll:true});
}
function openPub(){
  resetConv();
  cur={id:"pub",pub:true,peer:{name:"One Chat"}};
  setHead();updateStatus();showConv();renderMsgs();markPubRead();renderList();
}
function closeUI(){
  resetConv();cur=null;
  $("conv").hidden=true;$("ph").hidden=false;$("app").classList.remove("open");renderList();
}
function goBack(){if(history.state&&history.state.chat)history.back();else closeUI()}
addEventListener("popstate",()=>{if(cur)closeUI()});

function updateStatus(){
  if(!cur)return;
  let s="";
  if(cur.pub)s=t("pub");
  else if(peerDoc){
    const ls=ms(peerDoc.lastSeen);
    if(peerDoc.online&&Date.now()-ls<100000)s=t("online");
    else if(ls)s=t("seen")+" "+(isToday(ls)?hhmm(ls):isYest(ls)?t("yest")+" "+hhmm(ls):dateShort(ls));
  }
  const el=$("hst");
  if(el.textContent!==s){el.textContent=s;el.classList.remove("sw");void el.offsetWidth;el.classList.add("sw")}
  syncTyping();
}
// ---- yazıyor göstergesi: sohbette üç noktalı baloncuk
const typHtml=an=>`<div class="m typ${an?" in":""}" id="typ"><span></span><span></span><span></span></div>`;
function isTyping(){if(!cur||cur.pub)return false;const tp=meta["t_"+cur.peer.uid];return !!tp&&Date.now()-tp<4500}
function syncTyping(){
  if(!cur)return;
  const box=$("msgs"),el=$("typ"),on=isTyping();
  if(on&&!el){
    const near=box.scrollHeight-box.scrollTop-box.clientHeight<90;
    box.insertAdjacentHTML("beforeend",typHtml(true));typShown=true;
    if(near)box.scrollTo({top:box.scrollHeight,behavior:"smooth"});
    updateTob();
  }else if(!on&&el&&!el.classList.contains("out")){
    typShown=false;el.classList.add("out");setTimeout(()=>el.remove(),220);
  }
}

// ---- okundu / iletildi
function markRead(){
  if(!cur||cur.pub||document.hidden)return;
  const id=cur.id,pid=cur.peer.uid;
  let last=0;rows.forEach(r=>{if(r.from===pid&&!r.pending)last=Math.max(last,ms(r.at))});
  const mine=chats.find(c=>c.id===id);
  if(last>(readSent[id]||0)||(mine&&mine.unread>0)){
    readSent[id]=last||1;
    setDoc(doc(db,"chats",id,"meta","state"),{["r_"+me.uid]:serverTimestamp()},{merge:true}).catch(()=>{});
    setDoc(doc(db,"users",me.uid,"chats",id),{unread:0},{merge:true}).catch(()=>{});
  }
}
function markPubRead(){
  if(!cur||!cur.pub||document.hidden)return;
  let m=pubReadAt;pubRows.forEach(r=>{if(!r.pending)m=Math.max(m,ms(r.at))});
  if(m!==pubReadAt){pubReadAt=m;store.set("pubRead",String(m));renderList()}
}
function markDelivered(){
  chats.forEach(c=>{
    const l=c.last;if(!l||l.from===me.uid||!l.at)return;
    const m=ms(l.at);
    if(m>(delivered[c.id]||0)){delivered[c.id]=m;setDoc(doc(db,"chats",c.id,"meta","state"),{["d_"+me.uid]:serverTimestamp()},{merge:true}).catch(()=>{})}
  });
}
function ticks(r,m){
  const pid=cur.peer.uid,st=r.pending?"p":ms(meta["r_"+pid])>=m?"r":ms(meta["d_"+pid])>=m?"d":"s";
  const pv=stState.get(r.id);if(pv!==undefined&&pv!==st)stAt.set(r.id,Date.now());stState.set(r.id,st);
  const pop=Date.now()-(stAt.get(r.id)||0)<500&&Date.now()-openedAt>1500?" pop":"";
  if(st==="r"){const p=cur.peer;return `<i class="st r${pop}" style="background:${avColor(p.email||p.name)}">${initial(p.name||p.email)}</i>`}
  return `<i class="st ${st}${pop}"></i>`;
}

// ---- mesaj çizimi
function bubble(r,m){
  const mine=r.from===me.uid;
  let inner="";
  if(r.deleted)inner=`<i class="dl">🚫 ${esc(t("deleted"))}</i>`;
  else{
    if(cur.pub&&!mine)inner+=`<b class="who" style="color:${avColor(r.from)}">${esc(r.name||"")}</b>`;
    if(r.replyTo)inner+=`<div class="rq" data-go="${esc(r.replyTo.id)}"><b>${esc(r.replyTo.name)}</b><span>${esc(r.replyTo.text)}</span></div>`;
    inner+=esc(r.text);
  }
  const[ca,sa]=animOf(msgAt,r.id,520);
  return `<div class="m${mine?" me":""}${ca}"${sa} data-id="${esc(r.id)}">${inner}<span class="mt">${hhmm(m)}${mine&&!cur.pub?ticks(r,m):""}</span></div>`;
}
function renderMsgs(){
  if(!cur)return;
  const box=$("msgs"),st=box.scrollTop,near=box.scrollHeight-st-box.clientHeight<90;
  const l=list().filter(r=>!hidden.has(r.id));
  let inc=false;
  if(l.length){
    const now=Date.now();
    if(!msgPainted){l.slice(-8).forEach((r,i)=>msgAt.set(r.id,now+i*30));msgPainted=true}
    else l.forEach(r=>{if(!seenMsg.has(r.id)){msgAt.set(r.id,now);if(r.from!==me.uid&&!r.pending&&!r.deleted){inc=true;if(!cur.pub)meta["t_"+cur.peer.uid]=0}}});
    l.forEach(r=>seenMsg.add(r.id));
  }
  let h="",d="";
  l.forEach(r=>{
    const m=r.at?ms(r.at):Date.now(),k=day0(m);
    if(k!==d){h+=`<div class="day">${esc(dayLabel(m))}</div>`;d=k}
    h+=bubble(r,m);
  });
  box.innerHTML=h||`<div class="empty">${esc(t("nomsg"))}</div>`;
  if(isTyping()){box.insertAdjacentHTML("beforeend",typHtml(!typShown));typShown=true}else typShown=false;
  if(inc)sound("in");
  const last=l[l.length-1];
  if(stick||near){box.scrollTop=box.scrollHeight;newCnt=0}
  else{box.scrollTop=st;if(l.length>prevLen&&last&&last.from!==me.uid)newCnt+=l.length-prevLen}
  prevLen=l.length;stick=false;updateTob();
}
function updateTob(){
  const b=$("msgs"),near=b.scrollHeight-b.scrollTop-b.clientHeight<90;
  if(near)newCnt=0;
  $("tob").hidden=near;$("tobN").textContent=newCnt||"";$("tobN").hidden=!newCnt;
}
$("msgs").addEventListener("scroll",updateTob,{passive:true});
$("tob").onclick=()=>{const b=$("msgs");b.scrollTo({top:b.scrollHeight,behavior:"smooth"})};

// ---- yazma kutusu
const ta=$("ta");
function autosize(){ta.style.height="auto";ta.style.height=Math.min(Math.max(ta.scrollHeight,44),140)+"px"}
let lastTyping=0;
ta.addEventListener("input",()=>{
  autosize();
  if(cur&&!cur.pub&&Date.now()-lastTyping>2500){
    lastTyping=Date.now();
    setDoc(doc(db,"chats",cur.id,"meta","state"),{["t_"+me.uid]:Date.now()},{merge:true}).catch(()=>{});
  }
});
const fine=()=>{try{return matchMedia("(pointer:fine)").matches}catch(e){return true}};
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&fine()){e.preventDefault();$("comp").requestSubmit()}});
const sdBtn=document.querySelector(".sd");
["pointerdown","mousedown"].forEach(ev=>sdBtn.addEventListener(ev,e=>e.preventDefault()));
sdBtn.addEventListener("animationend",()=>sdBtn.classList.remove("fly"));
function flySend(){sdBtn.classList.remove("fly");void sdBtn.offsetWidth;sdBtn.classList.add("fly")}
function startReply(id){
  const r=find(id);if(!r||r.deleted)return;
  replyTo={id:r.id,name:r.from===me.uid?t("you"):(r.name||(cur.peer&&cur.peer.name)||""),text:String(r.text||"").slice(0,120)};
  $("rbar").innerHTML=`<div class="rq"><b>${esc(replyTo.name)}</b><span>${esc(replyTo.text)}</span></div><button class="ib" id="rx" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
  $("rbar").hidden=false;$("rx").onclick=clearReply;ta.focus();
}
function clearReply(){replyTo=null;$("rbar").hidden=true}
$("comp").onsubmit=async e=>{
  e.preventDefault();
  const tx=ta.value.trim();if(!tx||!cur)return;
  const rep=replyTo?{id:replyTo.id,name:replyTo.name,text:replyTo.text}:null;
  ta.value="";autosize();clearReply();stick=true;
  ta.focus({preventScroll:true});flySend();sound("out");
  if(!cur.pub){lastTyping=0;setDoc(doc(db,"chats",cur.id,"meta","state"),{["t_"+me.uid]:0},{merge:true}).catch(()=>{})}
  try{
    if(cur.pub){
      await addDoc(collection(db,"onechat"),{from:me.uid,name:myName().slice(0,60),text:tx,at:serverTimestamp(),...(rep?{replyTo:rep}:{})});
    }else{
      const id=cur.id,b=writeBatch(db),mref=doc(collection(db,"chats",id,"messages"));
      b.set(mref,{from:me.uid,text:tx,at:serverTimestamp(),...(rep?{replyTo:rep}:{})});
      const lastOf=()=>({text:tx.slice(0,200),from:me.uid,at:serverTimestamp()});
      b.set(doc(db,"users",me.uid,"chats",id),{peer:cur.peer,last:lastOf(),updated:serverTimestamp(),unread:0},{merge:true});
      b.set(doc(db,"users",cur.peer.uid,"chats",id),{peer:meInfo(),last:lastOf(),updated:serverTimestamp(),unread:increment(1)},{merge:true});
      await b.commit();
    }
  }catch(err){toast(t("err"))}
};

// ---- mesaj menüsü (uzun bas / sağ tık), kaydırarak yanıtla
function showMenu(id,x,y){
  const r=find(id);if(!r)return;
  const mine=r.from===me.uid;
  let h="";
  if(!r.deleted)h+=`<button data-a="reply">${esc(t("reply"))}</button><button data-a="copy">${esc(t("copy"))}</button>`;
  h+=`<button data-a="me">${esc(t("delMe"))}</button>`;
  if(mine&&!r.deleted&&!r.pending)h+=`<button data-a="all">${esc(t("delAll"))}</button>`;
  const m=$("cm");m.innerHTML=h;m.dataset.id=id;m.hidden=false;
  const w=m.offsetWidth,hh=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+"px";
  m.style.top=Math.max(8,Math.min(y,innerHeight-hh-8))+"px";
  navigator.vibrate&&navigator.vibrate(8);
}
const hideMenu=()=>{$("cm").hidden=true};
$("cm").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=$("cm").dataset.id,r=find(id);hideMenu();if(!r)return;
  if(b.dataset.a==="reply")startReply(id);
  else if(b.dataset.a==="copy"){try{await navigator.clipboard.writeText(r.text);toast(t("copied"))}catch(err){}}
  else if(b.dataset.a==="me"){hidden.add(id);store.set("hid",JSON.stringify([...hidden]));renderMsgs()}
  else if(b.dataset.a==="all"){
    try{await updateDoc(cur.pub?doc(db,"onechat",id):doc(db,"chats",cur.id,"messages",id),{deleted:true,text:""})}catch(err){toast(t("err"))}
  }
};
let lp=null,px=0,py=0;
const msgs=$("msgs");
msgs.addEventListener("pointerdown",e=>{
  const m=e.target.closest(".m");if(!m||e.button>0)return;
  px=e.clientX;py=e.clientY;clearTimeout(lp);m.classList.add("pr");
  lp=setTimeout(()=>{lp=null;showMenu(m.dataset.id,px,py)},450);
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>msgs.addEventListener(ev,()=>{clearTimeout(lp);msgs.querySelectorAll(".pr").forEach(x=>x.classList.remove("pr"))}));
msgs.addEventListener("pointermove",e=>{if(lp&&(Math.abs(e.clientX-px)>8||Math.abs(e.clientY-py)>8))clearTimeout(lp)});
msgs.addEventListener("contextmenu",e=>{const m=e.target.closest(".m");if(m){e.preventDefault();showMenu(m.dataset.id,e.clientX,e.clientY)}});
msgs.addEventListener("click",e=>{
  const q=e.target.closest(".rq");if(!q||!q.dataset.go)return;
  const el=msgs.querySelector(`.m[data-id="${CSS.escape(q.dataset.go)}"]`);
  if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("fl");setTimeout(()=>el.classList.remove("fl"),1200)}
});
let sx=0,sy=0,sw=null;
msgs.addEventListener("touchstart",e=>{const m=e.target.closest(".m");if(!m||e.touches.length>1)return;sw=m;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
msgs.addEventListener("touchmove",e=>{
  if(!sw)return;
  const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10){sw.style.transform="";sw=null;return}
  const rtl=document.documentElement.dir==="rtl",d=rtl?-dx:dx;
  if(d>6){clearTimeout(lp);const v=Math.min(d,72);sw.dataset.sw=v;sw.style.setProperty("--p",Math.min(v/56,1));sw.style.transform=`translateX(${rtl?-v:v}px)`}
},{passive:true});
msgs.addEventListener("touchend",()=>{
  if(!sw)return;
  const m=sw,v=+m.dataset.sw||0;sw=null;
  m.style.transition="transform .2s";m.style.transform="";m.dataset.sw="";m.style.setProperty("--p",0);
  setTimeout(()=>{m.style.transition=""},220);
  if(v>=56){startReply(m.dataset.id);navigator.vibrate&&navigator.vibrate(10)}
});
addEventListener("click",e=>{if(!e.target.closest("#cm"))hideMenu();if(!e.target.closest("#menu")&&!e.target.closest("#bMenu"))$("menu").hidden=true});
msgs.addEventListener("scroll",hideMenu,{passive:true});

// ---- liste ve üst menü olayları
$("list").onclick=e=>{
  const b=e.target.closest(".row");if(!b)return;
  if(b.dataset.start)return startChat(b.dataset.start);
  if(b.dataset.k==="pub")return openPub();
  const c=chats.find(x=>x.id===b.dataset.id);if(c)openChat(c);
};
$("q").addEventListener("input",renderList);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&EM.test($("q").value.trim())){e.preventDefault();startChat($("q").value)}});
$("bNew").onclick=()=>{$("q").focus();$("q").select()};
$("bBack").onclick=goBack;
$("bTheme").onclick=()=>{
  const x=document.documentElement.dataset.theme==="dark"?"light":"dark";store.set("theme",x);
  const go=()=>setTheme(x);
  if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion:reduce)").matches)document.startViewTransition(go);else go();
};
$("bMenu").onclick=()=>{$("menu").hidden=!$("menu").hidden};
$("mAcct").onclick=()=>{location.href="index.html"};
$("mOut").onclick=()=>{ping(false).finally(()=>signOut(auth).finally(()=>location.replace("index.html")))};

// ---- başlatma
function init(){
  if(inited)return;inited=true;
  if(me.email)setDoc(doc(db,"emails",me.email.toLowerCase()),{uid:me.uid,name:myName()},{merge:true}).catch(()=>{});
  ping(true);
  setInterval(()=>{if(!document.hidden)ping(true)},40000);
  setInterval(updateStatus,1000);
  document.addEventListener("visibilitychange",()=>{ping(!document.hidden);if(!document.hidden){markRead();markPubRead()}});
  addEventListener("pagehide",()=>ping(false));
  U.chats=onSnapshot(query(collection(db,"users",me.uid,"chats"),orderBy("updated","desc")),s=>{
    chats=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"})}));
    chats.forEach(c=>{const u=c.unread||0,pv=unrd.get(c.id);if(pv!==undefined&&u>pv&&(!cur||cur.id!==c.id||document.hidden)){sound("in");rowAt.set(c.id,Date.now())}unrd.set(c.id,u)});
    renderList();markDelivered();markRead();
  },()=>toast(t("err")));
  U.pub=onSnapshot(query(collection(db,"onechat"),orderBy("at","desc"),limit(100)),s=>{
    pubRows=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"}),pending:d.metadata.hasPendingWrites})).reverse();
    renderList();if(cur&&cur.pub){renderMsgs();markPubRead()}
  },()=>toast(t("err")));
}
applyLang();setTheme(pickTheme());
onAuthStateChanged(auth,u=>{
  if(!u){location.replace("index.html");return}
  me=u;init();renderList();
});
</script>
