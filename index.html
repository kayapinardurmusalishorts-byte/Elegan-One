<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elegan One • Giriş Yap</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:#8b90a0;--fld:#0d0f14;--bd:#232734;--btn:#f3f4f8;--btnt:#000;--err:#ff6b6b;--ok:#5bd68a;--glow:rgba(110,130,255,.16);--ease:cubic-bezier(.2,.7,.2,1);--gl:rgba(8,10,16,.4);--gl2:rgba(255,255,255,.08);--glb:rgba(255,255,255,.1);--glh:rgba(255,255,255,.06);--gls:rgba(0,0,0,.55);--sh:rgba(255,255,255,.07);color-scheme:dark}
:root[data-theme=light]{--bg:#fff;--fg:#0b0d12;--mut:#5d6373;--fld:#f4f5f8;--bd:#d9dce5;--btn:#0b0d12;--btnt:#fff;--err:#d93636;--ok:#1f9d55;--glow:rgba(90,110,255,.13);--gl:rgba(236,239,248,.5);--gl2:rgba(255,255,255,.7);--glb:rgba(15,20,40,.1);--glh:rgba(255,255,255,.6);--gls:rgba(40,50,90,.25);--sh:rgba(255,255,255,.45);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;position:relative;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Inter","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:0;transition:background-color .4s,color .4s}
.glow{position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 28% 30%,var(--glow),transparent 70%),radial-gradient(35% 30% at 76% 72%,var(--glow),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
header,main,footer{position:relative;z-index:1}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes turn{from{opacity:0;transform:rotate(-90deg) scale(.6)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:center}
.lg{position:relative;overflow:hidden;display:block}
.lg img{display:block;max-width:none;opacity:0;transition:filter .4s,opacity .45s var(--ease)}
.lg img.ok{opacity:1}
:root[data-theme=light] .lg img{filter:invert(1)}
.lg.a{width:clamp(110px,20vw,210px);aspect-ratio:8/1;animation:slideL .9s var(--ease) .1s both}
.lg.b{height:clamp(34px,5.5vh,46px);width:40px;animation:slideR .9s var(--ease) .1s both}
main{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--hh) + 14px) 20px calc(var(--fh) + 14px)}
.view{display:none;width:100%;max-width:560px;margin:auto}
.view.on{display:block;animation:swap .5s var(--ease)}
h1{text-align:center;font-size:clamp(28px,5vh,40px);margin:0 0 clamp(12px,3.5vh,32px);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.f{min-width:0;padding-bottom:clamp(8px,1.8vh,16px)}
.f label{display:block;color:var(--mut);font-size:15px;margin:0 0 clamp(4px,.9vh,8px);transition:color .3s}
.f:focus-within label{color:var(--fg)}
.in #fE,.in #fP{grid-column:1/-1}
.f.su{max-height:0;opacity:0;padding-bottom:0;overflow:hidden;transform:translateY(-8px);visibility:hidden;pointer-events:none;transition:max-height .5s var(--ease),opacity .3s,transform .5s var(--ease),padding .5s var(--ease),visibility 0s .5s}
.up .f.su{max-height:170px;opacity:1;padding-bottom:clamp(8px,1.8vh,16px);transform:none;visibility:visible;pointer-events:auto;transition:max-height .5s var(--ease),opacity .45s .1s,transform .5s var(--ease) .05s,padding .5s var(--ease),visibility 0s}
.rise{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + 250ms)}
input{width:100%;height:clamp(44px,7vh,56px);border-radius:16px;border:1px solid var(--bd);background:var(--fld);color:var(--fg);padding:0 18px;font:inherit;transition:border-color .25s,box-shadow .25s,background-color .4s,color .4s}
input:focus{outline:0;border-color:var(--mut);box-shadow:inset 0 0 0 1px var(--mut)}
.f.bad input{border-color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
input.shake{animation:shake .4s}
.e{font-size:13px;line-height:1.3;color:var(--err);max-height:0;opacity:0;overflow:hidden;transform:translateY(-4px);transition:max-height .3s,opacity .3s,transform .3s,margin .3s}
.f.bad .e{max-height:60px;opacity:1;transform:none;margin-top:6px}
.pw{position:relative}
.pw input{padding-inline-end:52px}
.eye{position:absolute;inset-block:0;inset-inline-end:4px;width:46px;background:none;border:0;color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:color .2s,transform .2s}
.eye:hover{color:var(--fg)}
.eye:active{transform:scale(.9)}
.msg{min-height:20px;text-align:center;font-size:14px;color:var(--err);margin:0 0 10px;transition:color .3s}
.msg.ok{color:var(--ok)}
.msg.n{color:var(--mut)}
.msg:not(:empty){animation:swap .3s var(--ease)}
.go{position:relative;width:100%;height:clamp(46px,7vh,58px);border:0;border-radius:16px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:700;cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s,background-color .4s,color .4s}
.go:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px var(--fg)}
.go:active{transform:scale(.98);box-shadow:none}
.go.load{color:transparent;pointer-events:none}
.go.load::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:2px solid var(--btnt);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.go.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.go.alt:hover{border-color:var(--mut);box-shadow:none}
.card{border:1px solid var(--bd);background:var(--fld);border-radius:16px;padding:2px 18px;margin-bottom:clamp(10px,2vh,18px)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:clamp(8px,1.6vh,13px) 0;border-bottom:1px solid var(--bd)}
.kv:last-child{border:0}
.kv span{color:var(--mut)}
.kv b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cam{margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--bd)}
.cam[hidden],.ov[hidden]{display:none}
.cam video{display:block;width:100%;max-height:30vh;object-fit:cover}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;animation:fadeIn .25s}
.ovb{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .45s var(--ease)}
.ovb .go{width:min(78vw,340px)}
#ovH{margin:0;color:#c9ccd6;font-size:13px;text-align:center;max-width:min(78vw,340px)}
.qrbox{border:1px solid var(--bd);border-radius:18px;padding:16px 16px 18px;margin-top:clamp(10px,2vh,18px);background:linear-gradient(180deg,var(--fld),transparent);transition:border-color .3s,background-color .4s}
.qrbox:focus-within{border-color:var(--mut)}
.qrt{font-weight:700;margin-bottom:4px}
.qrh{margin:0 0 14px;color:var(--mut);font-size:13px;line-height:1.45}
.sec{color:var(--mut);font-size:14px;margin:6px 0 8px}
.prov.l{grid-template-columns:repeat(8,1fr);margin-bottom:clamp(10px,2vh,18px)}
.prov.l button{animation-delay:calc(var(--i)*50ms + 150ms)}
.prov button.ok{border-color:var(--mut)}
.prov button.ok[data-p=facebook]{color:#1877F2}
.prov button.ok[data-p=xbox]{color:#52B043}
.prov button.ok[data-p=playstation]{color:#2E6DF6}
.prov button.ok[data-p=google] path:nth-child(1){fill:#4285F4}
.prov button.ok[data-p=google] path:nth-child(2){fill:#34A853}
.prov button.ok[data-p=google] path:nth-child(3){fill:#FBBC05}
.prov button.ok[data-p=google] path:nth-child(4){fill:#EA4335}
.prov button.ok[data-p=microsoft] path:nth-child(1){fill:#F25022}
.prov button.ok[data-p=microsoft] path:nth-child(2){fill:#7FBA00}
.prov button.ok[data-p=microsoft] path:nth-child(3){fill:#00A4EF}
.prov button.ok[data-p=microsoft] path:nth-child(4){fill:#FFB900}
.lnk{display:block;margin:14px auto 0;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;transition:color .2s}
.lnk:hover{color:var(--fg)}
.lnk[hidden]{display:none}
.ovb img{display:block;width:min(78vw,340px);height:auto;border-radius:28px;box-shadow:0 30px 80px -20px #000}
.ovx{position:absolute;top:-14px;inset-inline-end:-14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--btn);color:var(--btnt);font-size:18px;cursor:pointer}
.flip h1,.flip .go{animation:swap .5s var(--ease) .05s both}
.boot .flip .go{animation-delay:.55s}
.row{display:flex;justify-content:space-between;margin:clamp(10px,2vh,18px) 4px clamp(12px,3vh,26px)}
.row button{color:var(--mut);background:none;border:0;font:inherit;padding:0;cursor:pointer;transition:color .2s,opacity .3s}
.row button:hover{color:var(--fg)}
.up #fg{opacity:0;pointer-events:none}
.prov{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.prov button{aspect-ratio:1;border-radius:14px;border:1px solid var(--bd);background:var(--fld);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;animation:pop .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i)*60ms + 800ms);transition:transform .25s var(--ease),border-color .25s,background-color .4s,color .4s}
.prov button.off{opacity:.45}
.prov button:hover{transform:translateY(-3px);border-color:var(--mut)}
.prov button:active{transform:scale(.94)}
.prov svg{width:52%;height:52%;fill:currentColor}
button:focus-visible,select:focus-visible{outline:2px solid var(--mut);outline-offset:2px}
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;animation:fadeIn 1s ease 1.2s both}
.studio{color:var(--mut);font-size:14px;letter-spacing:.03em;white-space:nowrap}
select{height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--fld);color:var(--fg);font:inherit;padding:0 12px;margin-inline-start:10px;transition:border-color .25s,background-color .4s,color .4s}
select:hover{border-color:var(--mut)}
#th{justify-self:end;width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--fld);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:transform .25s var(--ease),border-color .25s,background-color .4s,color .4s}
#th:hover{border-color:var(--mut);transform:scale(1.06)}
#th svg{width:22px;height:22px;fill:currentColor;animation:turn .5s var(--ease)}
@media(max-width:480px){.grid{column-gap:10px}.f label{font-size:14px}input{padding:0 14px}.prov{gap:5px}.lg.b{height:40px}#lLang{display:none}.studio{font-size:12px}}
:root{--hh:calc(68px + env(safe-area-inset-top,0px));--fh:calc(66px + env(safe-area-inset-bottom,0px))}
header,footer{position:fixed;left:0;right:0;z-index:5;background:var(--gl);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);transition:background-color .4s,border-color .4s}
header{top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;border-bottom:1px solid var(--glb);box-shadow:inset 0 -1px 0 var(--glh)}
footer{bottom:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh)}
header::before,footer::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,var(--sh),transparent 60%)}
header>*,footer>*{position:relative}
footer select,#th{background:var(--gl2)}
@media(max-width:600px){
:root{--hh:calc(50px + env(safe-area-inset-top,0px));--fh:calc(62px + env(safe-area-inset-bottom,0px))}
header{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.lg.a{width:96px}
.lg.b{height:32px}
h1{font-size:30px;margin-bottom:20px}
input{height:50px}
.f label{font-size:14px}
.kv{padding:11px 0}
.qrbox{padding:14px}
footer{grid-template-columns:1fr auto;grid-template-areas:"l t";padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
footer>div:first-child{grid-area:l}
#th{grid-area:t;width:44px;height:44px}
.studio{display:none}
#prov{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#prov button{width:calc((100% - 32px)/5)}
select{height:42px;max-width:150px;margin-inline-start:0}
}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pp{position:relative;width:96px;margin:0 auto 14px}
.pp button{width:96px;height:96px;border-radius:50%;border:1px solid var(--bd);background:var(--fld) center/cover no-repeat;color:var(--fg);font-size:36px;font-weight:700;display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--ease)}
.pp button:hover{transform:scale(1.04)}
.camp{position:absolute;inset-inline-end:0;bottom:0;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;pointer-events:none}
.camp svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-height:760px){.pp{width:72px;margin-bottom:10px}.pp button{width:72px;height:72px;font-size:28px}}
</style>

    <div class="card">

      <div class="kv"><span id="kE"></span><b id="vE"></b></div>

    <div class="prov l" id="provL"></div>

    <p class="qrh" id="qbH"></p>
    <div class="f" id="fAw" hidden><label for="apw" id="lAw"></label><div class="pw"><input id="apw" type="password" autocomplete="current-password" maxlength="64"><button type="button" class="eye" data-t="apw" aria-label="Show / hide password"></button></div><div class="e" role="alert"></div></div>

</main>
<div class="ov" id="ov" hidden><div class="ovb"><img id="qrImg" alt="QR"><button class="go" id="ovD" type="button"></button><p id="ovH"></p><button class="ovx" id="ovX" type="button" aria-label="Close">✕</button></div></div>

function rrp(x,a,b,w,h,r){x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
// Temaya uyumlu, yuvarlak hatlı QR kartı (koyu temada açık noktalar, açık temada koyu noktalar)
function qrStyled(text,dark,mk){
  const q=qrcode(0,"M");q.addData(text);q.make();
  const n=q.getModuleCount(),s=9,pad=36,w=n*s+pad*2,h=w+44,c=mk(w,h),x=c.getContext("2d");
  const fg=dark?"#f4f5f9":"#0b0d12";
  const g=x.createLinearGradient(0,0,w,h);
  if(dark){g.addColorStop(0,"#171a25");g.addColorStop(1,"#07080c")}else{g.addColorStop(0,"#ffffff");g.addColorStop(1,"#e9ecf4")}
  x.beginPath();rrp(x,0,0,w,h,30);x.fillStyle=g;x.fill();
  x.lineWidth=2;x.strokeStyle=dark?"#2b3040":"#d3d8e5";x.beginPath();rrp(x,1,1,w-2,h-2,29);x.stroke();
  x.fillStyle=fg;
  const fin=(r,k)=>(r<7&&k<7)||(r<7&&k>=n-7)||(r>=n-7&&k<7);
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){
    if(fin(r,k)||!q.isDark(r,k))continue;
    x.beginPath();rrp(x,pad+k*s+.5,pad+r*s+.5,s-1,s-1,(s-1)*.42);x.fill();
  }
  [[0,0],[0,n-7],[n-7,0]].forEach(([r,k])=>{
    const X=pad+k*s,Y=pad+r*s;
    x.beginPath();rrp(x,X,Y,7*s,7*s,2.3*s);rrp(x,X+s,Y+s,5*s,5*s,1.4*s);x.fill("evenodd");
    x.beginPath();rrp(x,X+2*s,Y+2*s,3*s,3*s,s);x.fill();
  });
  x.fillStyle=dark?"#8b90a0":"#5d6373";x.font="600 20px -apple-system,Helvetica,Arial,sans-serif";
  x.textAlign="center";x.textBaseline="middle";
  try{x.letterSpacing="6px"}catch(e){}
  x.fillText("ELEGAN ONE",w/2+3,w+8);
  return c;
}
const mkCv=(w,h)=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c};
let qrCv=null;
async function saveQr(){
  if(!qrCv)return;
  try{
    const blob=await new Promise(r=>qrCv.toBlob(r,"image/png"));
    const file=new File([blob],"elegan-one-giris-qr.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){}
}
$("qUp").onclick=()=>{if(pinOk("qpin","fQ"))$("qFile").click()};
$("qFile").onchange=e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const s=Math.min(1,1000/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.drawImage(img,0,0,w,h);
    const r=window.jsQR&&jsQR(x.getImageData(0,0,w,h).data,w,h);
    URL.revokeObjectURL(img.src);
    r?qrLogin(r.data):msg(T[lang][31]);
  };
  img.onerror=()=>msg(T[lang][31]);
  img.src=URL.createObjectURL(f);
};
$("qScan").onclick=async()=>{
  if(stream){stopCam();return}
  if(!pinOk("qpin","fQ"))return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const vd=$("vid");vd.srcObject=stream;await vd.play();$("cam").hidden=false;
    const c=document.createElement("canvas"),x=c.getContext("2d");
    const tick=()=>{
      if(!stream)return;
      if(vd.videoWidth){
        c.width=vd.videoWidth;c.height=vd.videoHeight;x.drawImage(vd,0,0);
        const r=window.jsQR&&jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
        if(r&&r.data.startsWith("EGO1:")){stopCam();qrLogin(r.data);return}
      }
      raf=requestAnimationFrame(tick);
    };
    tick();
  }catch(e){stopCam();msg(T[lang][12])}
};
$("aQr").onclick=async()=>{
  const t=T[lang];msg();
  if(!pinOk("apin","fQp"))return;
  let c=creds;
  if(!c){
    if(!hasPw())return msg(t[34],"n");
    const pw=$("apw").value;
    if(!pw)return setErr("fAw",t[19]);
    try{await signInWithEmailAndPassword(auth,cur.email,pw);c={e:cur.email,p:pw};setCreds(c);$("apw").value=""}
    catch(e){return setErr("fAw",t[24])}
  }
  try{
    const txt=await seal($("apin").value,{e:c.e,p:c.p});
    qrCv=qrStyled(txt,document.documentElement.dataset.theme==="dark",mkCv);
    $("qrImg").src=qrCv.toDataURL("image/png");
    $("ov").hidden=false;
  }catch(e){msg(t[12])}
};
$("ovD").onclick=saveQr;
function loadSaved(){
  let a=null;try{a=JSON.parse(store.get("acct")||"null")}catch(e){}
  $("lDel").hidden=!a;
  if(a&&a.e&&!$("em").value)$("em").value=a.e;
  return a;
}
function forgetSaved(){
  store.set("acct","");$("em").value="";$("pw").value="";$("lDel").hidden=true;
}
$("aOut").onclick=async()=>{try{await signOut(auth)}catch(e){}creds=null;cur=null;showView("f");loadSaved()};
$("aDel").onclick=async()=>{try{await signOut(auth)}catch(e){}creds=null;cur=null;forgetSaved();showView("f");msg(T[lang][39],"ok")};
$("lDel").onclick=()=>{forgetSaved();msg(T[lang][39],"ok")};
function enter(u){
  cur=u;
  if(u.email&&u.providerData.some(p=>p.providerId==="password"))store.set("acct",JSON.stringify({e:u.email,n:u.displayName||""}));
  fillAcc();showView("vA");registerMe();loadPP();
}
// Bağlı olmayan bir sağlayıcı hesabı yeni hesap açarsa hemen silinir ve giriş reddedilir
async function afterProvider(r){
  const ni=getAdditionalUserInfo(r);
  if(ni&&ni.isNewUser){
    try{await r.user.delete()}catch(e){try{await signOut(auth)}catch(_){}}
    provBusy=false;cur=null;creds=null;showView("f");msg(T[lang][45]);return;
  }
  provBusy=false;enter(r.user);
}
onAuthStateChanged(auth,u=>{
  if(provBusy)return;
  if(u)enter(u);
  else{cur=null;creds=null;if($("vA").classList.contains("on"))showView("f");loadSaved()}
});
if(store.get("rd")){
  provBusy=true;
  getRedirectResult(auth).then(r=>{store.set("rd","");if(r)return afterProvider(r);provBusy=false;if(auth.currentUser)enter(auth.currentUser)}).catch(()=>{store.set("rd","");provBusy=false});
}
$("prov").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;msg();
  const k=b.dataset.p;
  if(k==="qr"){showView("vQ");return}
  if(!ENABLED.includes(k)){msg(T[lang][14],"n");return}
  const p=PROV[k]();provBusy=true;
  try{await afterProvider(await signInWithPopup(auth,p))}
  catch(err){
    provBusy=false;
    if(err.code==="auth/popup-blocked"){store.set("rd","1");try{provBusy=true;await signInWithRedirect(auth,p);return}catch(e2){provBusy=false;store.set("rd","");err=e2}}
    fail(err);
  }
};
$("provL").onclick=async e=>{
  const b=e.target.closest("button");if(!b||!cur)return;msg();
  const k=b.dataset.p,t=T[lang];
  if(!ENABLED.includes(k))return msg(t[14],"n");
  if(isLinked(k))return msg(t[43],"n");
  try{
    await linkWithPopup(cur,PROV[k]());
    try{await cur.reload()}catch(_){}
    fillAcc();msg(t[42],"ok");
  }catch(err){
    const c=err.code||"";
    if(c==="auth/credential-already-in-use"||c==="auth/email-already-in-use")msg(t[44]);
    else if(c==="auth/operation-not-allowed"||c==="auth/configuration-not-found")msg(t[46]);
    else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")msg(t[12]+(c?" ("+c+")":""));
  }
};

// One M ayrı sayfada (onem.html); burada sadece kişi rehberine kayıt
const myName=()=>((cur&&cur.displayName)||((cur&&cur.email)||"").split("@")[0]||"?").trim();
function registerMe(){
  if(!cur||!cur.email)return;
  setDoc(doc(db,"emails",cur.email.toLowerCase()),{uid:cur.uid,name:myName()},{merge:true}).catch(()=>{});
}

<script>
// Logolar: Firebase'den bağımsız çalışır. Görselin boş kenarlarını otomatik bulup kırpar.
(function(){
var CROP={"elegan_1.png":[2000,1333,151,568,1632,198],"one_1.png":[1200,1200,365,285,550,630]};
function bbox(im){
  try{
    var W=im.naturalWidth,H=im.naturalHeight,k=Math.min(1,700/Math.max(W,H)),cw=Math.max(1,Math.round(W*k)),ch=Math.max(1,Math.round(H*k));
    var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
    var cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(im,0,0,cw,ch);
    var d=cx.getImageData(0,0,cw,ch).data,px=function(x,y){var o=(y*cw+x)*4;return [d[o],d[o+1],d[o+2],d[o+3]]};
    var cs=[px(0,0),px(cw-1,0),px(0,ch-1),px(cw-1,ch-1)],clear=cs.every(function(c){return c[3]<16}),bg=cs[0];
    var x0=cw,y0=ch,x1=-1,y1=-1;
    for(var y=0;y<ch;y++)for(var x=0;x<cw;x++){
      var o=(y*cw+x)*4,a=d[o+3],on;
      if(clear)on=a>24;
      else on=a>16&&(Math.abs(d[o]-bg[0])+Math.abs(d[o+1]-bg[1])+Math.abs(d[o+2]-bg[2])>60);
      if(on){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    }
    if(x1<0)return null;
    var X=Math.max(0,Math.floor(x0/k)),Y=Math.max(0,Math.floor(y0/k));
    return {x:X,y:Y,w:Math.min(W,Math.ceil((x1+1)/k))-X,h:Math.min(H,Math.ceil((y1+1)/k))-Y};
  }catch(e){return null}
}
function fit(im){
  var W=im.naturalWidth,H=im.naturalHeight,p=im.parentNode,c=CROP[im.dataset.n],b=null;
  if(!W)return;
  if(im.hasAttribute("data-auto"))b=bbox(im);
  if(!b&&c&&W===c[0]&&H===c[1])b={x:c[2],y:c[3],w:c[4],h:c[5]};
  if(b&&b.w>0&&b.h>0&&(b.w<W-2||b.h<H-2)){
    p.style.aspectRatio=b.w+"/"+b.h;
    Object.assign(im.style,{position:"absolute",width:(W/b.w*100)+"%",height:"auto",left:(-b.x/b.w*100)+"%",top:(-b.y/b.h*100)+"%"});
  }else{
    p.style.aspectRatio=W+"/"+H;
    Object.assign(im.style,{width:"100%",height:"100%",objectFit:"contain"});
  }
  if(p.classList.contains("b"))p.style.width="auto";
  im.classList.add("ok");
}
document.querySelectorAll(".lg img").forEach(function(im){
  if(im.complete&&im.naturalWidth)fit(im);else im.addEventListener("load",function(){fit(im)});
});
})();
</script>
